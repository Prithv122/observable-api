# Scrape config for the local stack. The API is scraped every 5s rather than the usual 15s
# because a load-test run only lasts a couple of minutes and coarser scrapes would leave the
# rate() windows too sparse to read.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: observable-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
